name: Create Draft Notice Pull Request

on:
  repository_dispatch:
    types:
      - notice-update
  schedule:
    - cron: 15 9 * * *
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: create-notice-pull-request
  cancel-in-progress: false

jobs:
  create:
    if: vars.NOTICE_PR_APP_ID != ''
    name: Create draft notice pull request
    runs-on: ubuntu-latest

    steps:
      - name: Create notice pull request token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.NOTICE_PR_APP_ID }}
          private-key: ${{ secrets.NOTICE_PR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: read
          permission-pull-requests: write

      - name: Create draft pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          NOTICE_BRANCH: update-local-tpn-files
          NOTICE_LABEL: notice-update
        run: |
          issue_number="$(gh issue list \
            --label "$NOTICE_LABEL" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number')"

          if [ -z "$issue_number" ]; then
            exit 0
          fi

          open_pr_count="$(gh pr list \
            --base "$BASE_BRANCH" \
            --head "$NOTICE_BRANCH" \
            --state open \
            --json number \
            --jq 'length')"

          if [ "$open_pr_count" -gt 0 ]; then
            exit 0
          fi

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$NOTICE_BRANCH" \
            --draft \
            --title "Update local notice files" \
            --body "Updates the Core and CLI third-party notice snapshots.

          Closes #$issue_number"
