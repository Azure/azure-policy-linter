name: Update Local Notice Files

on:
  workflow_dispatch:
  schedule:
    - cron: 0 9 * * *

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  GenerateNoticeUseLocalFile: false
  GenerateNoticeUpdateLocalFile: true

jobs:
  update:
    name: Update local notice files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/dirs.proj

      - name: Build
        run: dotnet build src/dirs.proj --configuration Release --no-restore

      - name: Generate notice files
        run: |
          dotnet pack src/PolicyLinter.Core/PolicyLinter.Core.csproj --configuration Release --no-build --no-restore -o ./packages
          dotnet pack src/PolicyLinter.Cli/PolicyLinter.Cli.csproj --configuration Release --no-build --no-restore -o ./packages

      - name: Update notice branch
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: Update local notice files
          commit_user_name: ${{ github.actor }}
          commit_user_email: ${{ github.actor }}@users.noreply.github.com
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          file_pattern: src/PolicyLinter.Core/local-tpn.txt src/PolicyLinter.Cli/local-tpn.txt
          branch: update-local-tpn-files
          commit_options: --no-verify --signoff
          status_options: --untracked-files=no
          push_options: --force
          skip_fetch: true
          skip_checkout: true
          create_branch: true
